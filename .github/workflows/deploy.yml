name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, atzingen-dev]
    timeout-minutes: 5
    steps:
      - name: Pull latest
        run: |
          set -e
          cd /var/local/apps/atzingen-dev
          git fetch origin main
          git reset --hard origin/main
          echo "head: $(git rev-parse --short HEAD)"

      - name: Build (refresh repos.json + build.json)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd /var/local/apps/atzingen-dev
          python3 build.py

      - name: Smoke check
        # Runner is on the LAN — pfSense has no hairpin NAT, so we hit nginx
        # directly via 127.0.0.1 with the right Host header. The cert is
        # served regardless and -k tolerates the IP/SAN mismatch.
        run: |
          set -e
          for path in / /data/profile.json /data/build.json; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' \
                        --resolve atzingen.dev:443:127.0.0.1 \
                        "https://atzingen.dev$path")
            echo "https://atzingen.dev$path -> $code"
            test "$code" = "200"
          done
